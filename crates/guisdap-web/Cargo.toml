[package]
name = "guisdap-web"
version.workspace = true
edition.workspace = true
[lib]
crate-type = ["cdylib", "rlib"]
[dependencies]
chrono = { version = "0.4", default-features = false, features = ["std"] }
guisdap-ion = { path = "../guisdap-ion" }
guisdap-core = { path = "../guisdap-core" }
serde.workspace = true
serde_json.workspace = true
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = { version = "0.3", features = ["Headers", "Window", "Crypto", "Storage", "Location", "Document", "HtmlCollection", "Element", "HtmlElement", "HtmlInputElement", "HtmlSelectElement", "HtmlCanvasElement", "Event", "MouseEvent", "PointerEvent", "KeyboardEvent", "DomRect", "EventTarget", "Response", "RequestInit", "RequestCache", "WebGl2RenderingContext", "WebGlProgram", "WebGlShader", "WebGlTexture", "WebGlBuffer", "WebGlUniformLocation", "console"] }
