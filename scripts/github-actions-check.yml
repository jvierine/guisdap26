name: Check
on: [push, pull_request]
jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y libhdf5-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: rustfmt, clippy
      - run: cargo fmt --all --check
      - run: cargo test --locked -p guisdap-core -p guisdap-worker
      - run: cargo clippy --locked -p guisdap-core -p guisdap-worker -- -D warnings
      - run: cargo clippy --locked -p guisdap-web --target wasm32-unknown-unknown -- -D warnings
      - run: cargo build --locked --release -p guisdap-web --target wasm32-unknown-unknown
      - run: test -z "$(git ls-files legacy local '*.h5' '*.mat' '*.pdf')"
