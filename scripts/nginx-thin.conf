# Include inside the juha.no server block.
location = /guisdap { return 308 /guisdap/; }
location /guisdap/data/ {
    alias /mnt/shovel/guisdap/;
    autoindex off;
    add_header X-Content-Type-Options nosniff;
}
location /guisdap/ {
    alias /var/www/guisdap/;
    index index.html;
    autoindex off;
    add_header X-Content-Type-Options nosniff;
}
# Ensure the server's MIME map includes application/wasm for .wasm.
