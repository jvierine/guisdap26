# Static GUI and exported analysis products; no compute API or raw archive access.
RedirectMatch 308 ^/guisdap$ /guisdap/
Alias /guisdap/ /srv/guisdap/
<Directory /srv/guisdap>
    Options -Indexes -ExecCGI
    AllowOverride None
    Require all granted
    DirectoryIndex index.html
    AddType application/wasm .wasm
    <FilesMatch "^(config|index)\.json$|\.html$|\.js$|\.wasm$|\.css$">
        Header set Cache-Control "no-cache"
    </FilesMatch>
</Directory>
